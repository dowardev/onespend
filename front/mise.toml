[tools]
# The frontend toolchain (vitest 0.34 + jsdom 22) does not run on Node 26:
# Node 26 exposes an experimental global `localStorage` that stays undefined
# without `--localstorage-file`, so the jsdom environment never takes over and
# every spec that touches localStorage fails. Node 24 is the line the CI uses
# (see .gitlab-ci.yml) and the last one this toolchain supports. Moving to the
# current LTS needs vitest 3.x/4.x first.
node = "24"
java = "21"
