apply plugin: 'com.android.application'

// Read the app version from the web package.json so every release is
// registered in the Android build without manual Gradle edits.
def appVersion = '0.0.0'
def pkgJson = file('../../package.json')
if (pkgJson.exists()) {
    def matcher = (pkgJson.text =~ /"version"\s*:\s*"([^"]+)"/)
    if (matcher.find()) {
        appVersion = matcher.group(1)
    }
}
// versionCode must be a monotonically increasing integer. Prefer the explicit
// "versionCode" field in package.json: F-Droid's autoupdate reads it (see
// fdroid/README.md), and it cannot evaluate the semver formula below. Fall back
// to the derived value so branches without the field keep building.
def explicitCode = null
if (pkgJson.exists()) {
    def codeMatcher = (pkgJson.text =~ /"versionCode"\s*:\s*(\d+)/)
    if (codeMatcher.find()) {
        explicitCode = codeMatcher.group(1) as Integer
    }
}
// 0.76.1 -> (0*100000)+(76*100)+1 = 76001
// rc suffix ignored: 0.76.1-rc.4 -> 76001
def versionParts = appVersion.tokenize('-')[0].tokenize('.')
def derivedCode = 0
if (versionParts.size() >= 3) {
    derivedCode = (versionParts[0] as Integer) * 100000 + (versionParts[1] as Integer) * 100 + (versionParts[2] as Integer)
}
def versionCodeNum = explicitCode != null ? explicitCode : derivedCode

// Release signing: keystore path and passwords come from environment
// variables (CI) or android/keystore.properties (local, gitignored).
def releaseSigning = null
def keystorePropsFile = rootProject.file('keystore.properties')
def keystorePath = System.getenv('KEYSTORE_FILE') ?: 'onespend-release.keystore'
def keystorePass = System.getenv('KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('KEY_ALIAS') ?: 'onespend'
if (keystorePropsFile.exists()) {
    def props = new Properties()
    keystorePropsFile.withInputStream { props.load(it) }
    keystorePath = props.getProperty('KEYSTORE_FILE', keystorePath)
    keystorePass = props.getProperty('KEYSTORE_PASSWORD')
    keyAliasName = props.getProperty('KEY_ALIAS', keyAliasName)
}
if (keystorePass != null && rootProject.file(keystorePath).exists()) {
    def storeFileResolved = rootProject.file(keystorePath)
    releaseSigning = {
        storeFile storeFileResolved
        storePassword keystorePass
        keyAlias keyAliasName
        keyPassword keystorePass
    }
}

android {
    namespace = "com.dowardev.onespend"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dowardev.onespend"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeNum
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    dependenciesInfo {
        // AGP 8.x otherwise injects a "Dependency metadata" APK signing block.
        // That block is not part of the standard signing scheme, and F-Droid's
        // scanner rejects extra signing blocks (see fdroid/README.md).
        includeInApk = false
        includeInBundle = false
    }
    if (releaseSigning != null) {
        signingConfigs {
            release releaseSigning
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
