# LBDS-289: declare the bundled-server + i18n state so the F-Droid
# reviewer can verify against the "NonFreeNet" / "TetheredNet" rules
# without reading the code. Sync is opt-in: the app does NOT connect
# to a hardcoded server on boot. The user picks the URL in Settings
# (the bundled default is the author public server, and the user can
# override it from Ajustes -> Conexiones without rebuilding the APK).
# UI is primarily Spanish; non-es locales get the full English wrap.
Description: "OneSpend is an offline-first personal finance manager. (i) Sync is opt-in: the app never connects to a hardcoded server - the user picks the backend URL in Ajustes -> Conexiones (the bundled default is the author's public server, only used if the user enables sync, and overridable in-app without a rebuild). (ii) UI is wrapped for es + en; the language selector is in the side menu."

AutoName: OneSpend

RepoType: git
Repo: https://gitlab.com/dowardev/onespend.git
Binaries: https://gitlab.com/dowardev/onespend/-/releases/v%v/downloads/onespend-%v.apk

Builds:
  - versionName: 0.77.0
    versionCode: 7700
    commit: 771fed63d553f1269828bbda8949cf3ba05ba65d
    subdir: front/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
      - npm install --global pnpm@latest-10
    init:
      - cd ../..
      - export VITE_APP_NAME=OneSpend
      - export VITE_API_URL=https://onespend-back.dowar.xyz
      - export VITE_SSO_URL=https://auth.dowar.xyz/api
      - export VITE_SSO_FRONTEND_URL=https://auth-panel.dowar.xyz
      - export SSO_CLIENT_ID_NATIVE=onespend-android
      - pnpm install --frozen-lockfile
      - pnpm run build:native
      - npx cap sync android
    gradle:
      - yes
    scandelete:
      - front/node_modules

