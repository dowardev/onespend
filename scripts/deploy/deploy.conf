# deploy.conf.example — oneSpend
# Configuración del proyecto para deploy.sh
# ESTE ARCHIVO SE COMMITEA — Config de build, paths, excludes, comandos
# Copia a scripts/deploy.conf si necesitas overrides locales (gitignored)

# ============================================================
# Project Type
# ============================================================
PROJECT_TYPE="fullstack"

# ============================================================
# Project Structure & Build Commands
# ============================================================
BACKEND_DIR="back"
FRONTEND_DIR="front"

# Backend build command (runs in isolated temp dir)
BACKEND_BUILD_CMD="composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache"

# Files to exclude from backend tarball (vendor INCLUDED: the artifact is
# self-contained because back/ uses a composer path repository pointing at the
# sibling sso checkout (../../sso/packages/sso-server) that cannot resolve on
# the server)
# NOTE: backend_deploy ships the sibling package and extracts it as
# <grandparent>/sso/packages/sso-server so the path layout resolves on the
# server (see .gitlab-ci.yml: .sso_checkout + backend_deploy).
BACKEND_ARTIFACT_EXCLUDES=".git node_modules .env* storage/* bootstrap/cache/*.php public/build/"

# Remote commands after extract (on server) — no composer install: vendor ships
# in the artifact (path repositories do not exist on the server).
# mkdir -p storage dirs first: Laravel's view compiler fails with
# "Please provide a valid cache path" when storage/framework/views is missing.
BACKEND_REMOTE_CMD="mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions && chmod -R 775 storage bootstrap/cache && php artisan migrate --force && php artisan config:cache && php artisan route:cache"

# Frontend build command
FRONTEND_BUILD_CMD="pnpm install --frozen-lockfile && pnpm run build"

# Frontend dist directory (relative to repo root)
FRONTEND_ARTIFACT_SOURCE="front/dist"

# ============================================================
# Setup Script (optional — first-run env config on the server)
# ============================================================
# Uploaded to the server app root (parent of back/) and made executable.
# NEVER executed automatically — run it manually via SSH (see reminder).
SETUP_SCRIPT="setup.sh"

# ============================================================
# Version Check (optional)
# ============================================================
# VERSION_CHECK_PKG="@tu-org/tu-paquete"
# VERSION_CHECK_FILE="packages/tu-paquete/package.json"