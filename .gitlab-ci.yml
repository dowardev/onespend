image: alpine:3.20

stages:
  - lint
  - test
  - build
  - deploy
  - rollback

variables:
  COMPOSER_HOME: "$CI_PROJECT_DIR/back/.composer"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - back/vendor/
    - back/.composer/cache/
    - front/.pnpm-store/

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc|dryrun)\.\d+)?$/'

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa

# NOTE: a template's `before_script` is REPLACED when another extended template
# defines one, so the `cd back` below is lost in every job that also extends
# `.sso_checkout` (which came later and defines its own). Those jobs must `cd
# back` explicitly in their `script`, or composer/pint/artisan run in the
# repository root, where there is no composer.json.
.backend_setup:
  before_script:
    - cd back

# The backend resolves dowardev/sso-server from a composer path repository
# pointing at the sibling sso checkout (../../sso/packages/sso-server).
# Runners only clone this repo, so every backend job must check out the
# sibling first (same group: CI_JOB_TOKEN is enough, no extra secrets).
.sso_checkout:
  before_script:
    - command -v git >/dev/null || apk add --no-cache git
    - rm -rf "$(dirname $CI_PROJECT_DIR)/sso"
    # NOTE: floats on sso main; the breaking-change guard is the ^0.1 constraint
    # on dowardev/sso-server (version field), so compatible minors are safe.
    - git clone --depth 1 --branch main "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/dowardev/sso.git" "$(dirname $CI_PROJECT_DIR)/sso"

.frontend_setup:
  before_script:
    - cd front
    - npm install -g pnpm@11.25.0 --no-audit --no-fund  # corepack download is broken in runners; npm fetch works
    - pnpm install --frozen-lockfile

backend_lint:
  stage: lint
  image: composer:2.8
  extends:
    - .backend_setup
    - .sso_checkout
    - .tag_rules
  script:
    # `.sso_checkout` replaces `.backend_setup`'s before_script, so `cd back` again.
    - cd back
    - composer install --prefer-dist --no-progress --no-interaction
    - vendor/bin/pint --test app/ config/ database/ routes/ bootstrap/app.php bootstrap/providers.php

backend_test:
  stage: test
  image: composer:2.8
  services:
    - name: mariadb:11
      alias: mariadb
  extends:
    - .backend_setup
    - .sso_checkout
    - .tag_rules
  variables:
    DB_CONNECTION: mariadb
    DB_HOST: mariadb
    DB_PORT: "3306"
    DB_DATABASE: onespend_test
    DB_USERNAME: root
    DB_PASSWORD: toor
    MARIADB_ROOT_PASSWORD: toor
    MARIADB_DATABASE: onespend_test
  script:
    # `.sso_checkout` replaces `.backend_setup`'s before_script, so `cd back` again.
    - cd back
    - docker-php-ext-install pdo_mysql
    - cp .env.example .env
    - composer install --prefer-dist --no-progress --no-interaction
    - php artisan key:generate
    - php artisan test

frontend_lint:
  stage: lint
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run typecheck
    - pnpm run lint

frontend_test:
  stage: test
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run test:unit

backend_build:
  stage: build
  image: composer:2.8
  extends:
    - .backend_setup
    - .sso_checkout
    - .tag_rules
  script:
    # `.sso_checkout` replaces `.backend_setup`'s before_script, so `cd back` again.
    - cd back
    - composer install --prefer-dist --no-progress --no-interaction
  artifacts:
    paths:
      - back/
      - '!back/.env*'
      - '!back/vendor/'
      - '!back/node_modules/'
      - '!back/storage/*'
      - '!back/bootstrap/cache/*.php'
      - '!back/public/build/'
    expire_in: 1 hour

frontend_build:
  stage: build
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run build
    - tar czf ../dist.tar.gz -C dist .
  artifacts:
    paths:
      - dist.tar.gz
    expire_in: 1 hour

backend_deploy:
  stage: deploy
  image: alpine:3.20
  extends:
    - .tag_rules
  # `!reference` COMPOSES both before_scripts: extending both templates would let
  # `.sso_checkout` replace `.ssh_setup`, leaving the job without ssh/scp.
  before_script:
    - !reference [.sso_checkout, before_script]
    - !reference [.ssh_setup, before_script]
  needs:
    - backend_build
    - backend_test
  script:
    - tar -czf /tmp/backend.tar.gz
        --exclude='.git'
        --exclude='node_modules'
        --exclude='vendor'
        --exclude='.env*'
        --exclude='storage/*'
        --exclude='bootstrap/cache/*.php'
        --exclude='public/build/'
        -C back .
    - tar -czf /tmp/sso-server.tar.gz -C ../sso/packages sso-server
    - scp -o ConnectTimeout=60 -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - scp -o ConnectTimeout=60 -P "$SSH_PORT" /tmp/sso-server.tar.gz "$SSH_USER@$SSH_HOST:/tmp/sso-server.tar.gz"
    - DEPLOY_PARENT=$(dirname $DEPLOY_PATH_BACKEND)
    - DEPLOY_GRANDPARENT=$(dirname $DEPLOY_PARENT)
    - '[ "$(basename $DEPLOY_PATH_BACKEND)" = "back" ] || (echo "DEPLOY_PATH_BACKEND must end in /back" >&2; exit 1)'
    - ssh -o ConnectTimeout=60 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_GRANDPARENT/sso/packages &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/sso-server.tar.gz -C $DEPLOY_GRANDPARENT/sso/packages &&
        cd $DEPLOY_PATH_BACKEND &&
        rm -f bootstrap/cache/*.php bootstrap/cache/*.json config/sanctum.php &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz &&
        rm /tmp/sso-server.tar.gz
      "

frontend_deploy:
  stage: deploy
  image: alpine:3.20
  extends:
    - .ssh_setup
    - .tag_rules
  needs:
    - frontend_build
    - frontend_test
    - frontend_lint
  dependencies:
    - frontend_build
  before_script:
    - !reference [.ssh_setup, before_script]
  script:
    - scp -o ConnectTimeout=60 -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND"
    - ssh -o ConnectTimeout=60 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_FRONTEND && tar xzvf dist.tar.gz && rm dist.tar.gz"



rollback_backend:
  stage: rollback
  image: alpine:3.20
  extends:
    - .tag_rules
  # Same composition as backend_deploy: see the note there.
  before_script:
    - !reference [.sso_checkout, before_script]
    - !reference [.ssh_setup, before_script]
  when: manual
  script:
    - PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
    - echo "Rolling back to $PREVIOUS_TAG"
    - git checkout "$PREVIOUS_TAG"
    - tar -czf /tmp/backend.tar.gz
        --exclude='.git'
        --exclude='node_modules'
        --exclude='vendor'
        --exclude='.env*'
        --exclude='storage/*'
        --exclude='bootstrap/cache/*.php'
        --exclude='public/build/'
        -C back .
    - scp -o ConnectTimeout=60 -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - tar -czf /tmp/sso-server.tar.gz -C ../sso/packages sso-server
    - scp -o ConnectTimeout=60 -P "$SSH_PORT" /tmp/sso-server.tar.gz "$SSH_USER@$SSH_HOST:/tmp/sso-server.tar.gz"
    - DEPLOY_GRANDPARENT=$(dirname $(dirname $DEPLOY_PATH_BACKEND))
    - ssh -o ConnectTimeout=60 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        mkdir -p $DEPLOY_GRANDPARENT/sso/packages &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/sso-server.tar.gz -C $DEPLOY_GRANDPARENT/sso/packages &&
        cd $DEPLOY_PATH_BACKEND &&
        rm -f bootstrap/cache/*.php bootstrap/cache/*.json config/sanctum.php &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
        rm /tmp/sso-server.tar.gz
      "

rollback_frontend:
  stage: rollback
  image: alpine:3.20
  extends:
    - .tag_rules
  when: manual
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval \$(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - apk add --no-cache nodejs npm
  script:
    - PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
    - echo "Rolling back to $PREVIOUS_TAG"
    - git checkout "$PREVIOUS_TAG"
    - cd front
    - npm install -g pnpm@11.25.0 --no-audit --no-fund  # corepack download is broken in runners; npm fetch works
    - pnpm install --frozen-lockfile
    - pnpm run build
    - tar czvf dist.tar.gz -C dist .
    - scp -o ConnectTimeout=60 -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND"
    - ssh -o ConnectTimeout=60 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_FRONTEND && tar xzvf dist.tar.gz && rm dist.tar.gz"