image: alpine:latest

stages:
  - lint
  - test
  - build
  - deploy
  - post-deploy
  - rollback

variables:
  COMPOSER_HOME: "$CI_PROJECT_DIR/back/.composer"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - back/vendor/
    - back/.composer/cache/
    - front/.pnpm-store/

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa

.backend_setup:
  before_script:
    - cd back

.frontend_setup:
  before_script:
    - cd front
    - corepack enable
    - pnpm install --frozen-lockfile

backend_lint:
  stage: lint
  image: composer:2.8
  extends:
    - .backend_setup
    - .tag_rules
  allow_failure: true
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - vendor/bin/pint --test app/ config/ database/ routes/ bootstrap/

backend_test:
  stage: test
  image: composer:2.8
  services:
    - name: mariadb:11
      alias: mariadb
  extends:
    - .backend_setup
    - .tag_rules
  allow_failure: true
  variables:
    APP_KEY: $APP_KEY
    DB_CONNECTION: mariadb
    DB_HOST: mariadb
    DB_PORT: "3306"
    DB_DATABASE: onespend_test
    DB_USERNAME: root
    DB_PASSWORD: toor
    MARIADB_ROOT_PASSWORD: toor
    MARIADB_DATABASE: onespend_test
  script:
    - cp .env.example .env
    - composer install --prefer-dist --no-progress --no-interaction
    - php artisan test

frontend_lint:
  stage: lint
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  allow_failure: true
  script:
    - pnpm run typecheck
    - pnpm run lint

frontend_test:
  stage: test
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  allow_failure: true
  script:
    - pnpm run test:unit

backend_assets_build:
  stage: build
  image: composer:2.8
  extends:
    - .backend_setup
    - .tag_rules
  script:
    - composer install --prefer-dist --no-progress --no-interaction
    - php artisan vite:build
  artifacts:
    paths:
      - back/public/build/
    expire_in: 1 hour

backend_build:
  stage: build
  image: composer:2.8
  extends:
    - .backend_setup
    - .tag_rules
  needs:
    - backend_assets_build
  script:
    - composer install --prefer-dist --no-progress --no-interaction
  artifacts:
    paths:
      - back/
      - '!back/.env*'
      - '!back/vendor/'
      - '!back/node_modules/'
      - '!back/storage/*'
      - '!back/bootstrap/cache/*.php'
      - '!back/public/build/'
    expire_in: 1 hour

frontend_build:
  stage: build
  image: node:24.4-alpine
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - pnpm run build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1 hour

backend_deploy:
  stage: deploy
  image: alpine
  extends:
    - .ssh_setup
    - .tag_rules
  needs:
    - backend_build
    - backend_test
  script:
    - tar -czf /tmp/backend.tar.gz
        --exclude='.git'
        --exclude='node_modules'
        --exclude='vendor'
        --exclude='.env*'
        --exclude='storage/*'
        --exclude='bootstrap/cache/*.php'
        --exclude='public/build/'
        -C back .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force --seed=SystemTestSeeder &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

frontend_deploy:
  stage: deploy
  image: alpine
  extends:
    - .tag_rules
  needs:
    - frontend_build
    - frontend_test
    - frontend_lint
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval \$(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - apk add --no-cache nodejs npm
  script:
    - mkdir -p /tmp/front && tar xzf front/dist.tar.gz -C /tmp/front 2>/dev/null || true
    - 'if [ ! -d /tmp/front/dist ]; then echo "ERROR: front/dist artifact not found"; exit 1; fi' 
    - |
      if scp -P "$SSH_PORT" /tmp/front/dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND" 2>/dev/null; then
        echo "Artifact deployed"
      else
        cd front
        pnpm run build
        tar czvf dist.tar.gz dist/
        scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND"
      fi
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        cd $DEPLOY_PATH_FRONTEND &&
        tar xzvf dist.tar.gz &&
        rm dist.tar.gz
      ""

post_deploy_backend:
  stage: post-deploy
  image: alpine
  extends:
    - .tag_rules
  needs:
    - backend_deploy
  before_script:
    - apk add --no-cache wget jq
  script:
    - wget -q -S --spider --timeout=30 "$HEALTHCHECK_URL_BACKEND/api/system-test" || exit 1
    - wget -qO- "$HEALTHCHECK_URL_BACKEND/api/system-test" | jq -e '.db == "ok" and .seed_data != null' >/dev/null || exit 1

post_deploy_frontend:
  stage: post-deploy
  image: alpine
  extends:
    - .tag_rules
  needs:
    - frontend_deploy
  before_script:
    - apk add --no-cache wget
  script:
    - wget -q -S --spider --timeout=30 "$HEALTHCHECK_URL_FRONTEND"

rollback_backend:
  stage: rollback
  image: alpine
  extends:
    - .ssh_setup
    - .tag_rules
  when: manual
  script:
    - PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
    - echo "Rolling back to $PREVIOUS_TAG"
    - git checkout "$PREVIOUS_TAG"
    - tar -czf /tmp/backend.tar.gz
        --exclude='.git'
        --exclude='node_modules'
        --exclude='vendor'
        --exclude='.env*'
        --exclude='storage/*'
        --exclude='bootstrap/cache/*.php'
        --exclude='public/build/'
        -C back .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

rollback_frontend:
  stage: rollback
  image: alpine
  extends:
    - .tag_rules
  when: manual
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval \$(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - apk add --no-cache nodejs npm
  script:
    - PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
    - echo "Rolling back to $PREVIOUS_TAG"
    - git checkout "$PREVIOUS_TAG"
    - cd front
    - corepack enable
    - pnpm install --frozen-lockfile
    - echo "VITE_API_URL=$VITE_API_URL" >> .env.production
    - pnpm run build
    - tar czvf dist.tar.gz dist/
    - scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_FRONTEND && tar xzvf dist.tar.gz && rm dist.tar.gz"