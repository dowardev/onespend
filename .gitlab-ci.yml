image: alpine:latest

stages:
  - backend-test
  - backend-deploy
  - frontend-lint
  - frontend-test
  - frontend-deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - back/vendor/
    - back/.composer/cache/
    - front/node_modules/

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

.backend_setup:
  before_script:
    - cd back

.frontend_setup:
  before_script:
    - cd front

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

backend_test:
  stage: backend-test
  image: php:8.2-cli
  extends:
    - .backend_setup
    - .tag_rules
  script:
    - composer install --prefer-dist
    - php artisan test --parallel

backend_deploy:
  stage: backend-deploy
  image: alpine
  extends:
    - .ssh_setup
    - .tag_rules
  script:
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_BACKEND && git pull && composer install --no-dev --optimize-autoloader && php artisan migrate --force"
  needs: [backend_test]

frontend_checks:
  stage: frontend-lint
  image: node:lts
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - npm install -g pnpm
    - pnpm install --frozen-lockfile
    - pnpm run typecheck
    - pnpm run lint

frontend_test:
  stage: frontend-test
  image: node:lts
  extends:
    - .frontend_setup
    - .tag_rules
  script:
    - npm install -g pnpm
    - pnpm install --frozen-lockfile
    - pnpm run test:unit

frontend_deploy:
  stage: frontend-deploy
  image: alpine
  extends:
    - .tag_rules
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache nodejs npm
    - cd front
    - npm install -g pnpm
    - pnpm install --frozen-lockfile
    - echo "VITE_API_URL=$VITE_API_URL" >> .env.production
  script:
    - pnpm run build
    - tar czvf dist.tar.gz dist/
    - scp -P "$SSH_PORT" dist.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_PATH_FRONTEND"
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH_FRONTEND && tar xzvf dist.tar.gz && rm dist.tar.gz"
  needs: [frontend_checks, frontend_test]
